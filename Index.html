<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa; --card:#fff; --ink:#101828; --ink2:#344054; --mute:#667085; --faint:#98a2b3;
  --line:#eaecf0; --soft:#f2f4f7;
  --acc:#4f46e5; --acc-d:#4338ca; --acc-bg:#eef2ff;
  --ok:#039855; --ok-bg:#ecfdf3; --warn:#dc6803; --warn-bg:#fffaeb;
  --bad:#d92d20; --bad-bg:#fef3f2; --blue:#1570ef; --blue-bg:#eff8ff;
  --r:16px; --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--mute)} .sm{font-size:13px}

/* layout */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4338ca);display:grid;place-items:center;color:#fff;flex:none}
.brand b{font-size:15.5px;line-height:1.2;display:block}
.brand span{font-size:12px;color:var(--mute)}
.nav-l{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:500;text-decoration:none;cursor:pointer;margin-bottom:2px}
.nav a svg{width:18px;height:18px;color:var(--faint);flex:none}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--acc-bg);color:var(--acc-d);font-weight:600}
.nav a.on svg{color:var(--acc)}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--line)}
.me b{display:block;font-size:13.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me span{font-size:12px;color:var(--mute)}
.main{flex:1;min-width:0;padding:30px 34px 60px}
.wrap{max-width:1080px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.2}
.page-h p{margin:4px 0 0;color:var(--mute)}
.mtop,.mnav{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:20px}
.card h2{font-size:15.5px;margin:0;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.cols{display:grid;grid-template-columns:5fr 7fr;gap:20px;align-items:start}
.cols > .card{margin-bottom:0}

/* hero */
.hero{background:linear-gradient(135deg,#4f46e5 0%,#6366f1 55%,#818cf8 100%);color:#fff;border:0}
.hero .greet{font-size:13px;opacity:.85;font-weight:500}
.hero .big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .sub{opacity:.85;font-size:13.5px}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.hero .row3 div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.hero .row3 span{display:block;font-size:11.5px;opacity:.8}
.hero .row3 b{font-size:16px;font-variant-numeric:tabular-nums}
.hbtn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;background:#fff;color:var(--acc-d);transition:transform .1s}
.hbtn:active{transform:scale(.99)}
.hbtn.out{background:#111827;color:#fff}
.hero .done{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.16);border-radius:12px;padding:11px 14px;font-weight:600}
.hero .done button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font-size:13px;opacity:.9}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--acc-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid #d0d5dd;box-shadow:var(--sh)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.x{background:none;border:0;color:var(--faint);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:12.5px;flex:none}
.x:hover{background:var(--bad-bg);color:var(--bad)}
.x.arm{background:var(--bad);color:#fff}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.mute{background:var(--soft);color:var(--mute)} .chip.acc{background:var(--acc-bg);color:var(--acc-d)}
.chip.plain::before{display:none}

/* tasks */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar{flex:1;height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid #d0d5dd;background:#fff;cursor:pointer;flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s}
.tick:hover{border-color:var(--acc)}
.tick.doing{border-color:var(--blue);background:var(--blue-bg)}
.tick.done{border-color:var(--ok);background:var(--ok)}
.tick svg{width:12px;height:12px;color:#fff}
.t-main{flex:1;min-width:0}
.t-title{font-weight:600;word-wrap:break-word}
.task.done .t-title{color:var(--faint);text-decoration:line-through}
.t-det{font-size:13px;color:var(--mute);white-space:pre-wrap;word-wrap:break-word;margin-top:1px}
.t-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--faint)}
.pr-high{color:var(--bad);font-weight:600} .pr-low{color:var(--blue)}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:2px;flex:none}
.seg button{background:none;border:0;padding:4px 9px;font-size:12px;font-weight:600;color:var(--mute);border-radius:7px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1}

/* forms */
.form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
label.fl{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=email],input[type=date],input[type=time],input:not([type]),select,textarea{
  width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:9px 12px;background:#fff;font-size:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#a5b4fc;box-shadow:0 0 0 4px #eef2ff}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;margin:0}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.tile span{font-size:13px;color:var(--mute);font-weight:500}
.tile b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}

/* tables */
.tw{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:10px 12px;background:var(--soft);white-space:nowrap}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.who small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.ini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.drep td{border-bottom:0;padding:10px 12px}
.drep tr.grp td{border-top:1px solid var(--line)}
.drep tbody tr:first-child td{border-top:0}
.wide td.long{min-width:200px;white-space:pre-wrap}

/* date bar */
.dbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dbar input{width:auto}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid #d0d5dd;background:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh)}
.ib:hover{background:var(--soft)}
.ib svg{width:16px;height:16px}

/* report cards */
.rc{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.rc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rc-h .who{flex:1}
.rc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.rc-g h4{margin:0 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.rc-g p{margin:0;white-space:pre-wrap;word-wrap:break-word;font-size:13.5px}
.rc ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}

/* misc */
.empty{text-align:center;padding:34px 16px;color:var(--mute);font-size:14px}
.empty svg{width:34px;height:34px;color:#d0d5dd;display:block;margin:0 auto 8px}
.skel{height:14px;background:linear-gradient(90deg,#f2f4f7,#eaecf0,#f2f4f7);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.center .card{max-width:440px;text-align:center;padding:34px}
.center h1{font-size:21px;margin:14px 0 8px}
.mem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:0}
.mem .who{flex:1;min-width:0}
.mem.off{opacity:.55}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:440px;box-shadow:0 24px 48px -12px rgba(16,24,40,.25)}
.dlg h3{margin:0 0 4px;font-size:17px}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#101828;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw;box-shadow:0 12px 24px rgba(16,24,40,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mtop .brand{padding:0;flex:1}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 4px;border-radius:10px;cursor:pointer;text-decoration:none}
  .mnav a svg{width:20px;height:20px}
  .mnav a.on{color:var(--acc)}
  .shell{display:block}
  .main{padding:18px 14px 96px}
  .cols,.f2,.f3,.rc-g{grid-template-columns:1fr}
  .page-h h1{font-size:21px}
  .hero .big{font-size:36px}
  .task{flex-wrap:wrap}
  .task .t-main{flex:1 1 calc(100% - 70px)}
  .task .seg{margin-left:34px}
  .toast{bottom:92px}
  .tw{margin:0 -22px}
}
</style>
</head>

const ST = { todo: 'To do', doing: 'In progress', done: 'Done' };

function flatRows(groups, withDate) {
  const out = [];
  groups.forEach(g => {
    const li = g.login ? fTime(g.login) : 'Absent', lo = g.logout ? fTime(g.logout) : (g.login ? '—' : '');
    const head = (withDate ? [g.date] : []).concat([g.name, li, lo]), blank = head.map(() => '');
    if (!g.tasks.length) out.push(head.concat(['—', '']));
    g.tasks.forEach((t, i) => out.push((i ? blank : head).concat([t.title, ST[t.status]])));
  });
  return out;
}
